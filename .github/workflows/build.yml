name: Build and verify Alpi
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Alpi-0.3.0-beta-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest server/tests -q
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: alpi-beta-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Alpi-0.3.0-beta-debug-apk
          path: apk
      - name: Publish tested beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ALPI_VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          ALPI_TAG="v$ALPI_VERSION"
          if gh release view "$ALPI_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its APK."
            exit 0
          fi
          cp apk/app-debug.apk "Alpi-v$ALPI_VERSION.apk"
          sha256sum "Alpi-v$ALPI_VERSION.apk" > "Alpi-v$ALPI_VERSION.apk.sha256"
          gh release create "$ALPI_TAG" "Alpi-v$ALPI_VERSION.apk" "Alpi-v$ALPI_VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Alpi $ALPI_VERSION" --notes-file "docs/RELEASE_NOTES_v$ALPI_VERSION.md"
